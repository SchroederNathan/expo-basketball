name: Issue to PR

'on':
  workflow_dispatch:
    inputs:
      repository:
        type: string
        required: true
        description: Trusted owner/repository
      target_ref:
        type: string
        required: true
        description: Explicit PR base containing the audited baseline, normally release/prizepicks-demo
      candidate_sha:
        type: string
        required: true
        description: Exact target SHA, also required as workflow --ref
      issue_number:
        type: string
        required: true
        description: Trusted issue, a pinned demo issue with a marker or an open issue without one

permissions:
  account:
    role: developer

concurrency:
  group: codex-subscription-agentic-ios
  queue: max
  cancel_in_progress: false

defaults:
  tools:
    bun: 1.2.22
    node: 22.23.1

jobs:
  preflight:
    name: Freeze the original issue and explicit target
    environment: preview
    env:
      AGENT_REPOSITORY: ${{ inputs.repository }}
      AGENT_SOURCE_REF: ${{ inputs.target_ref }}
      AGENT_SOURCE_SHA: ${{ inputs.candidate_sha }}
      AGENT_TASK: change
      AGENT_ISSUE_NUMBER: ${{ inputs.issue_number }}
    outputs:
      issue_digest: ${{ steps.freeze.outputs.issue_digest }}
      criteria_sha256: ${{ steps.freeze.outputs.criteria_sha256 }}
      issue_kind: ${{ steps.freeze.outputs.issue_kind }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: freeze
        run: |
          bun .eas/agents/run.ts preflight
          set-output issue_digest "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/preflight.json", "utf8")).issueDigest')"
          set-output criteria_sha256 "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/preflight.json", "utf8")).criteriaSha256')"
          set-output issue_kind "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/preflight.json", "utf8")).issueKind')"

  # An open issue needs the unfixed app installed, so its generated test can fail first.
  fingerprint:
    type: fingerprint
    needs: [preflight]
    if: ${{ needs.preflight.outputs.issue_kind == 'open' }}
    environment: preview
    env:
      EXPO_PUBLIC_AGENT_DEMO: prizepicks-v1

  get_build:
    type: get-build
    needs: [fingerprint]
    environment: preview
    params:
      platform: ios
      profile: agent-preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    environment: preview
    params:
      platform: ios
      profile: agent-preview

  repack:
    type: repack
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    environment: preview
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: agent-preview
      embed_bundle_assets: true
      js_bundle_only: false

  change:
    name: Repair, validate, and publish through the controller
    needs: [preflight]
    after: [fingerprint, get_build, build, repack]
    environment: preview
    env:
      AGENT_REPOSITORY: ${{ inputs.repository }}
      AGENT_SOURCE_REF: ${{ inputs.target_ref }}
      AGENT_SOURCE_SHA: ${{ inputs.candidate_sha }}
      AGENT_TASK: change
      AGENT_ISSUE_NUMBER: ${{ inputs.issue_number }}
      AGENT_ISSUE_DIGEST: ${{ needs.preflight.outputs.issue_digest }}
      AGENT_CRITERIA_SHA256: ${{ needs.preflight.outputs.criteria_sha256 }}
      AGENT_ISSUE_KIND: ${{ needs.preflight.outputs.issue_kind }}
      AGENT_RUN_ID: ${{ workflow.id }}
      AGENT_RUN_URL: ${{ workflow.url }}
      AGENT_BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id || '' }}
      AGENT_NATIVE_SOURCE_BUILD_ID: ${{ after.get_build.outputs.build_id || '' }}
      AGENT_NATIVE_SOURCE_SHA: ${{ after.get_build.outputs.git_commit_hash || '' }}
      AGENT_FINGERPRINT: ${{ after.fingerprint.outputs.ios_fingerprint_hash || '' }}
    outputs:
      state: ${{ steps.change.outputs.state }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install the e2e tools for an open issue
        run: |
          if [ "$AGENT_ISSUE_KIND" = open ]; then
            bun install --cwd .eas/agents/testerarmy --frozen-lockfile --ignore-scripts
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
      - id: change
        run: |
          rm -f agent-output/status.json
          bun .eas/agents/run.ts change || true
          if [ -f agent-output/status.json ]; then
            set-output state "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/status.json", "utf8")).state')"
          else
            set-output state INCONCLUSIVE
          fi
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: issue-to-pr-evidence
          path: agent-output/public/**/*

  result:
    name: Require a published candidate or an explicit no-change result
    after: [preflight, change]
    if: ${{ after.change.outputs.state != 'PR_READY' && after.change.outputs.state != 'NO_CHANGE' }}
    steps:
      - run: |
          echo 'Issue to PR has no verified outcome. Inspect its controller report. No merge or deployment is authorized.'
          exit 1
