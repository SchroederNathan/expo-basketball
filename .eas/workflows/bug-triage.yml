name: Bug triage iOS

'on':
  workflow_dispatch:
    inputs:
      repository:
        type: string
        required: true
        description: Trusted owner/repository
      target_ref:
        type: string
        required: true
        description: Branch containing the audited workflow baseline
      candidate_sha:
        type: string
        required: true
        description: Exact candidate SHA, also required as workflow --ref
      issue_number:
        type: string
        required: true
        description: Trusted synthetic issue with the player-label marker

permissions:
  account:
    role: developer

concurrency:
  group: codex-subscription-agentic-ios
  queue: max
  cancel_in_progress: false

defaults:
  tools:
    bun: 1.2.22

jobs:
  preflight:
    name: Verify trusted candidate
    environment: preview
    env:
      AGENT_REPOSITORY: ${{ inputs.repository }}
      AGENT_SOURCE_REF: ${{ inputs.target_ref }}
      AGENT_SOURCE_SHA: ${{ inputs.candidate_sha }}
      AGENT_TASK: triage
      AGENT_ISSUE_NUMBER: ${{ inputs.issue_number }}
    outputs:
      issue_digest: ${{ steps.freeze.outputs.issue_digest }}
      criteria_sha256: ${{ steps.freeze.outputs.criteria_sha256 }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: freeze
        run: |
          bun .eas/agents/run.ts preflight
          set-output issue_digest "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/preflight.json", "utf8")).issueDigest')"
          set-output criteria_sha256 "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/preflight.json", "utf8")).criteriaSha256')"

  fingerprint:
    type: fingerprint
    needs: [preflight]
    environment: preview
    env:
      EXPO_PUBLIC_AGENT_DEMO: prizepicks-v1

  get_build:
    type: get-build
    needs: [fingerprint]
    environment: preview
    params:
      platform: ios
      profile: agent-preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    environment: preview
    params:
      platform: ios
      profile: agent-preview

  repack:
    type: repack
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    environment: preview
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: agent-preview
      embed_bundle_assets: true
      js_bundle_only: false

  check:
    name: Reproduce on the selected installed iOS artifact
    needs: [preflight, fingerprint, get_build]
    after: [build, repack]
    environment: preview
    env:
      AGENT_REPOSITORY: ${{ inputs.repository }}
      AGENT_SOURCE_REF: ${{ inputs.target_ref }}
      AGENT_SOURCE_SHA: ${{ inputs.candidate_sha }}
      AGENT_TASK: triage
      AGENT_ISSUE_NUMBER: ${{ inputs.issue_number }}
      AGENT_ISSUE_DIGEST: ${{ needs.preflight.outputs.issue_digest }}
      AGENT_CRITERIA_SHA256: ${{ needs.preflight.outputs.criteria_sha256 }}
      AGENT_RUN_ID: ${{ workflow.id }}
      AGENT_RUN_URL: ${{ workflow.url }}
      AGENT_BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
      AGENT_NATIVE_SOURCE_BUILD_ID: ${{ needs.get_build.outputs.build_id || '' }}
      AGENT_NATIVE_SOURCE_SHA: ${{ needs.get_build.outputs.git_commit_hash || '' }}
      AGENT_FINGERPRINT: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
    outputs:
      state: ${{ steps.check.outputs.state }}
      attempt_id: ${{ steps.check.outputs.attempt_id }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install media evidence tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - id: check
        run: |
          rm -f agent-output/status.json
          bun .eas/agents/run.ts triage || true
          if [ -f agent-output/status.json ]; then
            set-output state "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/status.json", "utf8")).state')"
            set-output attempt_id "$(node -p 'JSON.parse(require("fs").readFileSync("agent-output/status.json", "utf8")).attemptId')"
          else
            set-output state INCONCLUSIVE
          fi
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: bug-triage-ios-evidence
          path: agent-output/public/**/*

  result:
    name: Require a definitive triage and publication receipt
    after: [preflight, fingerprint, get_build, build, repack, check]
    if: ${{ after.check.outputs.state != 'REPLICATED' && after.check.outputs.state != 'NOT_REPLICATED' }}
    steps:
      - run: |
          echo 'Triage or publication is inconclusive. Inspect the retained result and evidence artifacts.'
          exit 1
